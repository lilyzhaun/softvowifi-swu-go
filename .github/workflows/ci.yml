name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Non-privileged Go checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GIT_MASTER: "1"
      GOMAXPROCS: "2"
      GOFLAGS: -mod=readonly
      ISSUE33_KERNEL_TEST: "0"
      SOFTVOWIFI_REQUIRE_NETNS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          cache: true
      - name: Report retained-source formatting
        run: git ls-files -z '*.go' | xargs -0 -r gofmt -l
      - name: Test synthetic and loopback regressions
        run: go test -p 1 -race -shuffle=on -count=1 -timeout=120s ./...
      - name: Vet
        run: go vet -p 1 ./...
